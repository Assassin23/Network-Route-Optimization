[project]
name = "routes"
version = "0.1.0"
description = "REST API for network route optimization (nodes, edges, shortest paths) built with Django and DRF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
